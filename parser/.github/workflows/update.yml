name: Update timetable

on:
  schedule:
    - cron: "23 * * * *"   # каждый час (UTC); GitHub может запускать с задержкой
  workflow_dispatch: {}     # кнопка "Run workflow" для ручного запуска

permissions:
  contents: write

concurrency:
  group: update-timetable
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: parser/requirements.txt

      - run: pip install -r parser/requirements.txt

      - name: Tests
        run: python parser/tests/test_parser.py

      - name: Fetch & parse
        run: python parser/fetch_and_build.py

      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain docs)" ]; then
            git config user.name "timetable-bot"
            git config user.email "timetable-bot@users.noreply.github.com"
            git add docs
            git commit -m "Обновление расписания $(TZ=Europe/Moscow date '+%Y-%m-%d %H:%M')"
            git push
          else
            echo "Нет изменений"
          fi
